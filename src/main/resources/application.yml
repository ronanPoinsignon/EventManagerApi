app:
  name: back_end_pladonf
  description: ${app.name} is a Spring Boot application
server:
  port: 8000

spring:
  datasource:
    platform: mysql
    url: jdbc:mysql://localhost:${MYSQL_PORT}/${DATABASE_NAME}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    initialization-mode: always
    driver: com.mysql.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
      naming:
        strategy: org.hibernate.cfg.ImprovedNamingStrategy
  rabbitmq:
    host: ${rabbit.host}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    dynamic: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.external-server-url}/realms/${KEYCLOAK_REALM}
          jwk-set-uri: ${keycloak.internal-server-url}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
  logging:
    level:
      org:
        springframework:
          amqp: DEBUG
          rabbit: DEBUG