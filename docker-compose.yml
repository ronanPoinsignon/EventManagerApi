services:
  backend-api:
    container_name: back_end_pladonf
    build:
      context: .
      dockerfile: Dockerfile.java
    ports:
      - ${SPRING_PORT}:8000
    volumes:
      - app-data:/var/lib/data
    depends_on:
      mysqldb:
        condition: service_healthy
      init-keycloak:
        condition: service_completed_successfully
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/${DATABASE_NAME}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_PORT=${KEYCLOAK_PORT}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
    networks:
      - pladonf_api
      - pladonf_auth
      - pladonf_rabbitmq

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:24.0.4
    command: start-dev --features=preview --import-realm --verbose
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KEYCLOAK_SERVER_ADDRESS: http://keycloak:8080
    ports:
      - ${KEYCLOAK_PORT}:8080
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak-realm.json:/opt/keycloak/data/import/keycloak-realm.json
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/kcadm.sh", "get", "realms/master", "--server", "http://localhost:8080"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pladonf_auth

  init-keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    entrypoint: [ "/bin/sh", "/init-keycloak.sh" ]
    environment:
      KEYCLOAK_USER: ${KEYCLOAK_USER}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_PASSWORD}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
    volumes:
      - ./init-keycloak.sh:/init-keycloak.sh
    networks:
      - pladonf_auth

  mysqldb:
    image: mysql:8.2.0
    container_name: mysqldb_pladonf
    environment:
      - MYSQL_DATABASE=${DATABASE_NAME}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - ${MYSQL_PORT}:3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      retries: 10
      interval: 3s
      timeout: 30s
    networks:
      - pladonf_api
      - pladonf_auth
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - ${RABBITMQ_PORT}:5672
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - pladonf_rabbitmq-data:/var/lib/rabbitmq
    networks:
      - pladonf_rabbitmq

volumes:
  app-data:
    name: event-organizer-app-data
  mysql-data:
    name: event-organizer-mysql-data
  keycloak-data:
    name: event-organizer-keycloak-data
  pladonf_rabbitmq-data:
    name: pladonf_rabbitmq-data

networks:
  pladonf_api:
    name: pladonf_api
  pladonf_auth:
    name: pladonf_auth
  pladonf_rabbitmq:
    name: pladonf_rabbitmq